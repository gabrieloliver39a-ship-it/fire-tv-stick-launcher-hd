name: Build APK

# Quando roda:
#  - a cada commit na branch main ou master
#  - ao publicar uma versão (tag que começa com "v", ex.: v1.0.0): também anexa o APK na página Releases
#  - manualmente: aba Actions > Build APK > Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

# Se vier um commit novo enquanto um build está rodando, cancela o antigo
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # necessário só para anexar o APK em Releases

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # O plugin Android do Gradle 8.5.2 exige JDK 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma e build-tools usadas pelo projeto
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Usa o Gradle 8.9 definido em gradle/wrapper/gradle-wrapper.properties
      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      # Ao enviar arquivos pelo navegador no Windows, o bit de execução se perde
      - name: Permitir execução do gradlew
        run: chmod +x gradlew

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Dar nome fácil ao APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FireTvStickLauncherHD.apk

      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FireTvStickLauncherHD-apk
          path: FireTvStickLauncherHD.apk
          if-no-files-found: error
          retention-days: 30

      - name: Guardar relatórios se a compilação falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-erro
          path: app/build/reports
          if-no-files-found: ignore

      - name: Anexar APK na página Releases (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FireTvStickLauncherHD.apk
